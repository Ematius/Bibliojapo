<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Las dos familias que se usan de verdad: Shippori Mincho (cabeceras) y
         Zen Kaku Gothic New (texto y japonés).

         Cinzel NO se pide, aunque `--font-roman` la siga declarando: está
         reservada para el logotipo, que todavía no existe, y ningún componente la
         aplica. El día que se use el logotipo hay que volver a añadirla aquí, o se
         verá con la serif del sistema.

         Los pesos son exactamente los que aparecen en el CSS. Cada peso de una
         familia japonesa son cientos de reglas @font-face —los miles de glifos van
         troceados por rangos de Unicode— así que pedir uno de más cuesta mucho más
         que en una fuente latina. Antes se pedía el 500 de Shippori, que no usaba
         nadie.

         Las servimos NOSOTROS, desde `public/fonts/`, y no el CDN de Google: desde
         su CDN, cada visitante le manda su IP, y eso obliga a declararlo en la
         política de privacidad. No volver a apuntar a `fonts.googleapis.com` por
         ahorrarse los 13 MB del repo — el visitante solo descarga los fragmentos
         que su texto necesita, así que no los paga nadie.

         ── Por qué NO bloquea el render ─────────────────────────────────────
         Este archivo tardaba 2,2 segundos en llegar y hasta entonces no se
         pintaba NADA. Con `media="print"` el navegador lo descarga pero no lo
         considera necesario para dibujar, y al terminar `onload` lo pasa a `all`
         y la tipografía entra.

         Se puede hacer porque la portada no tiene una sola letra: es una escena
         de ilustraciones. Nadie ve el cambio de fuente, y para cuando hay texto
         en pantalla la familia lleva rato cargada. -->
    <link
      href="/fonts/fonts.css"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Sin JavaScript no hay `onload` que valga, así que la hoja se pide de la
         forma de siempre. Aquí sí bloquea, que es lo correcto: es la única manera
         de que el texto salga con su letra. -->
    <noscript>
      <link href="/fonts/fonts.css" rel="stylesheet" />
    </noscript>
    <meta
      name="description"
      content="Bibliojapo: aprende japonés recorriendo los pasillos de una biblioteca de manga."
    />
    <title>Bibliojapo — aprende japonés tomo a tomo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
