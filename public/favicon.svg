<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BOF">
  <defs>
    <linearGradient id="bofLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="55%" stop-color="#f0c96a"/>
      <stop offset="100%" stop-color="#e8932a"/>
    </linearGradient>

    <linearGradient id="bofWood" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8b5e3c"/>
      <stop offset="60%" stop-color="#5c3a1e"/>
      <stop offset="100%" stop-color="#3a2210"/>
    </linearGradient>

    <linearGradient id="bofBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c96a"/>
      <stop offset="100%" stop-color="#a8802b"/>
    </linearGradient>

    <radialGradient id="bofGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe8bc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe8bc" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="bofArch">
      <path d="M15 55V27a17 17 0 0 1 34 0v28z"/>
    </clipPath>
  </defs>

  <!-- Fondo: el oscuro cálido del tema -->
  <rect width="64" height="64" rx="14" fill="#17100a"/>

  <!-- Luz del interior de la biblioteca -->
  <path d="M15 55V27a17 17 0 0 1 34 0v28z" fill="url(#bofLight)"/>

  <!-- Las dos hojas de puerta, entreabiertas: dejan una rendija de luz -->
  <g clip-path="url(#bofArch)">
    <path d="M15 55V27a17 17 0 0 1 13.6-16.657V55z" fill="url(#bofWood)"/>
    <path d="M49 55V27a17 17 0 0 0-13.6-16.657V55z" fill="url(#bofWood)"/>
  </g>

  <!-- Resplandor que se derrama por la rendija -->
  <ellipse cx="32" cy="34" rx="13" ry="21" fill="url(#bofGlow)"/>

  <!-- Tiradores de latón -->
  <circle cx="27.4" cy="35" r="1.5" fill="#f0c96a"/>
  <circle cx="36.6" cy="35" r="1.5" fill="#f0c96a"/>

  <!-- Marco de piedra y latón -->
  <path d="M15 55V27a17 17 0 0 1 34 0v28" fill="none" stroke="url(#bofBrass)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Umbral -->
  <rect x="10" y="52.5" width="44" height="5" rx="2.5" fill="url(#bofBrass)"/>
</svg>
